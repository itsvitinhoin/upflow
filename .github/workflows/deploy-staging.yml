name: Deploy Staging

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      tested_sha:
        description: "Exact Test-verified staging commit SHA to deploy."
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: upflow-staging-release
  # Do not cancel an in-progress Prisma migration. Later staging releases wait
  # their turn instead of risking a partially applied database change.
  cancel-in-progress: false

jobs:
  verify-staging:
    name: Verify staging release gates
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'staging' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.target.outputs.head_sha }}

    steps:
      - name: Resolve and verify the Test-verified staging commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          MANUAL_SHA: ${{ inputs.tested_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            if [ "${WORKFLOW_EVENT}" != "push" ] || [ "${WORKFLOW_HEAD_BRANCH}" != "staging" ] || [ "${WORKFLOW_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]; then
              echo "::error::The Test workflow provenance is not an in-repository staging push."
              exit 1
            fi

            HEAD_SHA="${WORKFLOW_SHA}"
          else
            HEAD_SHA="${MANUAL_SHA}"

            if [ -z "${HEAD_SHA}" ]; then
              echo "::error::A Test-verified staging commit SHA is required."
              exit 1
            fi

            test_runs="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?branch=staging&event=push&status=completed&per_page=100")"

            if ! jq --exit-status --arg sha "${HEAD_SHA}" --arg repository "${GITHUB_REPOSITORY}" '
              any(.workflow_runs[];
                .name == "Test" and
                .head_sha == $sha and
                .event == "push" and
                .head_branch == "staging" and
                .conclusion == "success" and
                .head_repository.full_name == $repository
              )
            ' <<< "${test_runs}" > /dev/null; then
              echo "::error::${HEAD_SHA} has no successful Test run from an in-repository staging push."
              exit 1
            fi
          fi

          if [ -z "${HEAD_SHA}" ]; then
            echo "::error::The successful Test workflow did not report a staging commit SHA."
            exit 1
          fi

          staging_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/staging" | jq --raw-output '.object.sha')"

          if [ "${HEAD_SHA}" != "${staging_sha}" ]; then
            echo "::error::Refusing to deploy ${HEAD_SHA}; current staging head is ${staging_sha}."
            exit 1
          fi

          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Staging release is using Test-verified current staging commit ${HEAD_SHA}."

  migrate-staging:
    name: Migrate staging database
    needs: verify-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.UPFLOW_STAGING_MIGRATION_URL }}
      DIRECT_URL: ${{ secrets.UPFLOW_STAGING_MIGRATION_URL }}
      UPFLOW_RELEASE_TARGET: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-staging.outputs.head_sha }}

      - name: Require the direct staging database URL
        run: |
          if [ -z "${DIRECT_URL}" ]; then
            echo "::error::Set UPFLOW_STAGING_MIGRATION_URL in the GitHub staging environment."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @workspace/up-flow run db:generate

      - name: Require the completed cloned-schema baseline
        run: pnpm --filter @workspace/up-flow run db:migrate:assert-staging-baseline

      - name: Verify migration readiness before staging release
        run: pnpm --filter @workspace/up-flow run db:migrate:preflight

      - name: Apply reviewed Prisma migrations to staging
        run: pnpm --filter @workspace/up-flow run db:migrate:deploy

      - name: Verify migration state after staging release
        run: pnpm --filter @workspace/up-flow run db:migrate:status

  deploy-staging:
    name: Deploy and probe staging
    needs: [verify-staging, migrate-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      STAGING_VERCEL_ORG_ID: ${{ vars.UPFLOW_STAGING_VERCEL_ORG_ID }}
      STAGING_VERCEL_PROJECT_ID: ${{ vars.UPFLOW_STAGING_VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      KNOWN_PRODUCTION_VERCEL_PROJECT_ID: prj_5u1i9AP68L2OIKDQhCX0zzG4uCQq

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-staging.outputs.head_sha }}

      - name: Require isolated staging Vercel credentials
        run: |
          if [ -z "${STAGING_VERCEL_ORG_ID}" ] || [ -z "${STAGING_VERCEL_PROJECT_ID}" ] || [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::Set UPFLOW_STAGING_VERCEL_ORG_ID and UPFLOW_STAGING_VERCEL_PROJECT_ID as staging variables, plus VERCEL_TOKEN as a staging secret."
            exit 1
          fi

          if [ "${STAGING_VERCEL_PROJECT_ID}" = "${KNOWN_PRODUCTION_VERCEL_PROJECT_ID}" ]; then
            echo "::error::UPFLOW_STAGING_VERCEL_PROJECT_ID points at the known production Vercel project. Refusing to deploy staging."
            exit 1
          fi

          if [[ ! "${STAGING_VERCEL_ORG_ID}" =~ ^team_[A-Za-z0-9]+$ ]] || [[ ! "${STAGING_VERCEL_PROJECT_ID}" =~ ^prj_[A-Za-z0-9]+$ ]]; then
            echo "::error::The staging Vercel IDs are malformed. Use the IDs of the separate upflow-staging project."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy the Test-verified staging commit
        id: deploy
        run: |
          deployment_output="$(npx --yes vercel@56.2.1 deploy --prod --yes \
            --token "${VERCEL_TOKEN}" \
            --scope "${STAGING_VERCEL_ORG_ID}" \
            --project "${STAGING_VERCEL_PROJECT_ID}")"
          deployment_url="$(printf '%s\n' "${deployment_output}" | tail -n 1)"

          if [[ ! "${deployment_url}" =~ ^https:// ]]; then
            echo "::error::Vercel did not return a deployment URL for the isolated staging project."
            printf '%s\n' "${deployment_output}"
            exit 1
          fi

          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "Staging deployment: ${deployment_url}"

      - name: Probe the deployed staging health endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
            "${{ steps.deploy.outputs.url }}/api/health"

      - name: Publish staging deployment summary
        run: |
          {
            echo "### Staging deployment complete"
            echo ""
            echo "- Commit: \`${{ needs.verify-staging.outputs.head_sha }}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Vercel project: \`${STAGING_VERCEL_PROJECT_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
